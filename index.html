<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>호치민 탐방 가이드</title>
<meta name="description" content="Sixman이 직접 확인한 호치민 여행 정보 — 장소 안내, 그랩용 주소 복사, 교통·항공 바로가기">
<meta name="theme-color" content="#0b5d4b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#1d2421; --muted:#64706b; --line:#e3dfd4;
  --brand:#0b5d4b; --brand-soft:#e2efe9; --accent:#d9472b; --chip:#efece3;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121614; --card:#1b211e; --ink:#e9eee9; --muted:#9aa7a1; --line:#2b332f;
    --brand:#4fbf9f; --brand-soft:#1f3a32; --accent:#ff7a5c; --chip:#252c28;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.5}
button{font:inherit;color:inherit}
a{color:inherit}
.app{max-width:1100px;margin:0 auto;min-height:100vh;display:flex}
/* side nav (tablet/pc) */
.side{display:none}
main{flex:1;min-width:0;padding-bottom:84px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:800;font-size:17px;letter-spacing:-.3px}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.sub{background:var(--chip);border-color:transparent}
.chip.sub.on{background:var(--ink);color:var(--bg)}
.zone{font-size:11.5px;color:var(--muted);flex:none;align-self:center;padding:0 2px 0 6px}
section.page{display:none;padding:16px}
section.page.on{display:block}
h2{font-size:19px;margin:4px 0 12px;letter-spacing:-.3px}
h3{font-size:15.5px;margin:20px 0 8px}
.hero{background:linear-gradient(135deg,var(--brand),#13806a);color:#fff;border-radius:18px;padding:18px;box-shadow:var(--shadow)}
body[data-page="home"] header.top{display:none}
.hhero{position:relative;margin:-16px -16px 0;padding:22px 20px 20px;color:#fff;overflow:hidden;
  background:linear-gradient(180deg,rgba(6,30,25,.25) 0%,rgba(6,30,25,.55) 45%,rgba(6,30,25,.92) 100%),var(--hero, none),
  radial-gradient(120% 90% at 85% 0%,#1f8a6f 0%,#0b5d4b 45%,#062e26 100%);background-size:cover;background-position:center}
.hhero::after{content:"";position:absolute;right:-30px;bottom:96px;width:220px;height:120px;opacity:.18;pointer-events:none;
  background:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 220 120'%3E%3Cpath fill='white' d='M0 120V86h14V70h10v16h10V58h12v28h8V40h6V22h4v18h6v46h10V64h14v22h8V30l8-10 8 10v56h10V52h16v34h10V74h12v12h14V96h20v24z'/%3E%3C/svg%3E") no-repeat right bottom/contain}
.flags{display:inline-flex;align-items:center;gap:6px}
.flag{display:inline-block;vertical-align:middle;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.2);flex:none}
.hinfo .flag{border-radius:2px;margin-right:2px;vertical-align:-1px}
.hinfo b .flag{vertical-align:-2px;margin-right:4px}
.plane{font-size:12px;opacity:.85;margin:0 1px}
.flags .eyebrow{margin-left:6px}
.hhero-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.14em;opacity:.85}
.hhero-top .by{letter-spacing:.02em;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:3px 9px;border-radius:999px}
.hhero h1{font-size:34px;line-height:1.12;margin:54px 0 6px;letter-spacing:-1px;font-weight:800}
.hhero .sub{margin:0 0 16px;opacity:.85;font-size:14px}
.hsearch{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:0;border-radius:14px;padding:13px 14px;
  background:rgba(255,255,255,.96);color:#6b7570;font-size:14.5px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.hinfo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.hinfo > div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hinfo small{display:block;font-size:11px;opacity:.78}
.hinfo b{display:block;font-size:20px;letter-spacing:-.3px;margin:1px 0;font-variant-numeric:tabular-nums}
.sample.slim{margin:12px 0 0;padding:6px 10px;font-size:11.5px;text-align:center}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px 0 4px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 6px;box-shadow:var(--shadow)}
.qbtn{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;padding:6px 0;color:var(--ink)}
.qi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--brand-soft)}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sechead h3{margin:0;font-size:17px;letter-spacing:-.3px}
.linkbtn.more{text-decoration:none;font-weight:600;color:var(--brand)}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.ccard{flex:none;width:68%;max-width:260px;scroll-snap-align:start;cursor:pointer}
.cimg{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--brand-soft);box-shadow:var(--shadow)}
.cimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.ccard:hover .cimg img{transform:scale(1.04)}
.cbadge{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:3px 8px;border-radius:999px;backdrop-filter:blur(4px)}
.ct{font-weight:700;margin-top:8px;font-size:15px}
.cs{font-size:12.5px;color:var(--muted)}
.areas{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.atile{border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(135deg,hsl(var(--h) 45% 96%),var(--card));color:var(--ink)}
.atile b{font-size:14px}
.atile small{color:var(--muted);font-size:12px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .atile{background:linear-gradient(135deg,hsl(var(--h) 25% 16%),var(--card))}}
.tips{display:grid;gap:8px}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14px}
.tip .ti{flex:none;width:34px;height:34px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-size:17px}
.tip small{display:block;font-size:11.5px;color:var(--muted);margin-bottom:1px}
.cta{width:100%;margin-top:20px;display:flex;gap:12px;align-items:center;text-align:left;border:0;border-radius:18px;padding:16px;cursor:pointer;
  background:linear-gradient(135deg,#d9472b,#f08a4b);color:#fff;box-shadow:0 8px 22px rgba(217,71,43,.25)}
.cta > span:first-child{font-size:24px}.cta > span:last-child{margin-left:auto;font-size:22px;opacity:.8}
.cta b{display:block;font-size:15px}.cta small{opacity:.9;font-size:12.5px}
.foot{font-size:12px;color:var(--muted);margin:18px 2px 4px;line-height:1.6}
@media (min-width:600px){ .ccard{width:42%} .areas{grid-template-columns:repeat(4,1fr)} }
@media (min-width:900px){ .hhero{margin:0;border-radius:22px;padding:28px} .hhero h1{margin-top:40px} .carousel{margin:0;padding:2px 0 6px} .ccard{width:30%} }
.hero b{font-size:18px}
.hero p{margin:6px 0 0;opacity:.92;font-size:13.5px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start;cursor:pointer;text-align:left;width:100%}
.thumb{flex:none;width:56px;height:56px;border-radius:10px;background:var(--brand-soft);display:grid;place-items:center;font-size:24px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .t{font-weight:700}
.card .vi{font-size:12.5px;color:var(--muted)}
.card .d{font-size:13px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;font-size:11px;background:var(--chip);border-radius:6px;padding:1px 6px;margin-right:4px;color:var(--muted)}
.heart{margin-left:auto;flex:none;border:0;background:none;font-size:20px;cursor:pointer;padding:0 2px;line-height:1}
.empty{color:var(--muted);text-align:center;padding:28px 8px;font-size:14px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.big{width:100%;justify-content:center;padding:13px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list > div{padding:12px 14px;border-top:1px solid var(--line)}
.list > div:first-child{border-top:0}
.muted{color:var(--muted);font-size:13px}
.route .h{font-weight:700}
.route .m{font-size:13px;color:var(--muted)}
input.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
input.search:focus{border-color:var(--brand)}
.grouph{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}
.grouph b{font-size:15px}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer;padding:4px 0}
nav.tabs button .i{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--brand);font-weight:700}
/* detail sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s ease;max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.sheet-bg.on{display:block}
.grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:6px auto 12px}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:10px;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery img{flex:none;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;scroll-snap-align:center;background:var(--brand-soft)}
.fx-row{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--bg)}
.fx-row:focus-within{border-color:var(--brand)}
.fx-l{flex:none;width:92px;font-size:14px;color:var(--muted)}
.fx-in{flex:1;min-width:0;width:0;border:0;background:none;color:var(--ink);font-size:22px;font-weight:700;text-align:right;outline:none;padding:6px 0;font-variant-numeric:tabular-nums}
.fx-u{flex:none;width:34px;font-size:14px;color:var(--muted)}
.fx-h{font-size:12.5px;padding:0 2px;width:100%}
.steps{counter-reset:st;list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{counter-increment:st;position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 52px;box-shadow:var(--shadow)}
.steps li::before{content:counter(st);position:absolute;left:12px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px}
.steps li b{display:block;font-size:15px}
.steps li span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.steps em{font-style:normal;font-weight:700;color:var(--ink)}
.warn{color:var(--accent)}
#entryqr,#atmList{scroll-margin-top:110px}
ul.mini{margin:6px 0 0;padding-left:18px;font-size:13.5px;color:var(--muted)}
ul.mini li{margin:2px 0}
.guideimg{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.guideimg summary{cursor:pointer;font-weight:700}
.guideimg img{width:100%;border-radius:10px;margin-top:10px;display:block;cursor:zoom-in;min-height:120px;background:var(--chip)}
.zoomhint{text-align:center;font-size:12px;margin-top:6px}
.zoomview{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.92);overflow:auto;display:none;-webkit-overflow-scrolling:touch}
.zoomview.on{display:block}
.zoomview img{display:block;width:max(100%, 960px);max-width:none;margin:0 auto}
.zoomclose{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:41;border:0;border-radius:999px;background:rgba(255,255,255,.92);color:#111;font-weight:700;padding:10px 16px;cursor:pointer}
.mapbox{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--chip);aspect-ratio:4/3}
.mapbox iframe{width:100%;height:100%;border:0;display:block}
.addr{background:var(--chip);border-radius:12px;padding:12px;margin:12px 0;font-size:14.5px;word-break:keep-all}
.addr .l{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.kv{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;font-size:14px;margin:10px 0}
.kv span:nth-child(odd){color:var(--muted)}
.tag.org{font-weight:700}
.org-한{background:#e0ecff;color:#1d4ed8}.org-중{background:#fde2e2;color:#b91c1c}.org-베{background:#fff3c4;color:#92400e}
.adminbox{margin-top:12px;border:1px dashed var(--accent);border-radius:14px;padding:12px;background:color-mix(in srgb, var(--accent) 6%, transparent)}
.photolist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--chip)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;border:0;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;width:24px;height:24px;cursor:pointer;font-size:12px;line-height:24px;padding:0}
.ph button.first{top:auto;bottom:4px;left:4px;right:auto;width:auto;padding:0 8px;font-size:11px}
.ph span{position:absolute;left:4px;bottom:4px;background:var(--brand);color:#fff;font-size:11px;border-radius:999px;padding:1px 8px}
.form .chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px;margin-top:14px}
.form .chk input{width:auto}
.kybox{background:linear-gradient(135deg,color-mix(in srgb,#7e22ce 10%,var(--card)),var(--card));border:1px solid color-mix(in srgb,#7e22ce 30%,var(--line));border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.kyhead{display:flex;gap:12px;align-items:center}
.kyhead b{display:block;font-size:17px}
.kyhead small{display:block;font-size:12px;color:var(--muted)}
.kyi{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#7e22ce,#ec4899)}
.kylist{max-height:360px;overflow:auto}
.tag.book{background:#dcfce7;color:#166534;font-weight:700}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cbtn{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;text-decoration:none;color:var(--ink);cursor:pointer;font:inherit;min-width:0}
.cbtn > span{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px}
.cbtn b{display:block;font-size:13.5px}.cbtn small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbtn > div{min-width:0}
.cbtn.tel > span{background:#dcfce7}.cbtn.zalo > span{background:#dbeafe}.cbtn.kakao > span{background:#fef3c7}.cbtn.book > span{background:#ede9fe}
.bookmsg{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.bookmsg summary{cursor:pointer;font-weight:700}
.bm-row{display:grid;grid-template-columns:70px 1fr 100px;gap:8px;margin-top:10px}
.bm-row label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.bm-row select,.bm-row input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px;font:inherit;font-size:14px;min-width:0;width:100%}
.bm-out{margin-top:10px;background:var(--chip);border-radius:10px;padding:10px 12px;font-size:13.5px;white-space:pre-wrap;line-height:1.55}
.formsec{margin:18px 0 0;padding-top:12px;border-top:1px solid var(--line);font-weight:700;font-size:14px}
.badge{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin-right:4px;font-weight:700}
.badge.sixman{background:var(--brand-soft);color:var(--brand)}
.badge.user{background:#fde7dc;color:#b4441f}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px;cursor:pointer}
.adminbar{display:flex;justify-content:space-between;align-items:center;background:#fde7dc;color:#7a2d12;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.form label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px}
.form textarea{min-height:90px;resize:vertical}
.form .req{color:var(--accent)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.notice{font-size:12.5px;color:var(--muted);background:var(--chip);border-radius:10px;padding:10px 12px;margin-top:12px}
.sample{font-size:12px;background:#fff4d6;color:#7a5a00;border-radius:10px;padding:8px 12px;margin-bottom:12px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sample{background:#3a3115;color:#f0d78a}}
/* tablet & pc */
@media (min-width:600px){
  .grid{grid-template-columns:1fr 1fr}
}
@media (min-width:900px){
  nav.tabs{display:none}
  main{padding-bottom:24px}
  .side{display:flex;flex-direction:column;gap:4px;width:200px;flex:none;padding:16px 10px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line)}
  .side .brand{padding:4px 10px 14px}

function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  text = text.replace(/^﻿/,"");
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=ch;
    } else if(ch==='"') q=true;
    else if(ch===','){ row.push(cell); cell=""; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=ch;
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }

async function loadCSV(url, fallback){

    const res = await fetch(url + (url.includes("?")?"&":"?") + "t=" + Date.now());
    if(!res.ok) throw new Error(res.status);
    return {rows:parseCSV(await res.text()), sample:false};
  }catch(e){
    console.warn("시트를 불러오지 못해 샘플을 보여줍니다:", url, e);
    return {rows:parseCSV(fallback), sample:true};
  }
}

async function loadWikiImages(list){
  const todo = [...new Set(list.filter(p=>!ownPhotos(p).length).map(wikiTitle).filter(t=>t && !(t in wikiCache)))];

  await Promise.all(todo.map(async t=>{
    for(const lang of ["vi","en"]){

        const r = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t.replace(/ /g,"_"))}`);

        const d = await r.json();

      }catch(e){}

  if(/iPhone|iPad|iPod/i.test(ua)) return "itms-apps://search.itunes.apple.com/WebObjects/MZSearch.woa/wa/search?media=software&term=" + encodeURIComponent(appName);
  return "https://play.google.com/store/search?q=" + encodeURIComponent(appName) + "&c=apps";
}

function findTerminal(q){
  q = q.replace(/\s/g,"");
  if(!q) return "";
  const hit = TERMINALS.find(g=>g.names.some(n=>n.replace(/\s/g,"").includes(q) || q.includes(n.replace(/\s/g,""))));
  return hit ? `<b>${esc(hit.t)}</b>로 가세요.` : `목록에 없는 항공사예요. 전자항공권(e티켓)에 적힌 터미널을 확인하세요.`;
}

const RATE_DEFAULT = { krwPerUsd: 1400, vndPerUsd: 26000 };

async function fetchFx(){
  try{
    const r = await fetch("https://open.er-api.com/v6/latest/USD");
    const d = await r.json();
    if(d && d.rates && d.rates.KRW && d.rates.VND){
      fx.krwPerUsd = d.rates.KRW; fx.vndPerUsd = d.rates.VND;
      const day = (d.time_last_update_utc||"").split(" ").slice(1,4).join(" ");
      fx.source = "자동 (무료 환율 서비스" + (day?", "+day:"") + ")";
      saveFx(); return true;
    }
  }catch(e){}
  return false;
}
const num = s => Number(String(s).replace(/[^0-9.]/g,"")) || 0;
const fmt = (v, d=0) => (isFinite(v) ? v : 0).toLocaleString("ko-KR", {maximumFractionDigits:d, minimumFractionDigits:0});
function fxCalc(){
  const {cur, v} = fx.amount;
  const usd = cur==="krw" ? v / fx.krwPerUsd : cur==="vnd" ? v / fx.vndPerUsd : v;
  return { krw: usd * fx.krwPerUsd, usd, vnd: usd * fx.vndPerUsd };
}
function paintFx(except){
  const page = document.getElementById("p-money"); if(!page.dataset.ready) return;
  const r = fxCalc();
  const set = (id, val) => { if(id!==except) page.querySelector("#"+id).value = val ? fmt(val, id==="fxUsd"?2:0) : ""; };
  set("fxKrw", r.krw); set("fxUsd", r.usd); set("fxVnd", r.vnd);
  page.querySelector("#rateKrw").value = fmt(fx.krwPerUsd, 2);
  page.querySelector("#rateVnd").value = fmt(fx.vndPerUsd, 0);
  page.querySelector("#rateSrc").textContent = fx.source;
  page.querySelector("#krwPerVnd").textContent = fmt(fx.krwPerUsd / fx.vndPerUsd * 1000, 1);
}

async function kySearch(q, type){
  const tries = [];
  if(location.protocol.startsWith("http")) tries.push(`api/karaoke?type=${type}&q=${encodeURIComponent(q)}`);
  tries.push(`https://api.manana.kr/karaoke/${type}/${encodeURIComponent(q)}/kumyoung.json`);
  for(const url of tries){
    try{
      const res = await fetch(url);
      if(!res.ok) continue;
      const data = await res.json();
      if(Array.isArray(data)) return data;
    }catch(e){}
  }
  throw new Error("검색 실패");
}
function naverKyLink(q){ return "https://m.search.naver.com/search.naver?query=" + encodeURIComponent("금영 노래번호 " + q); }

function renderSearch(){
  const q = state.q.trim().toLowerCase();
  let body = "";
  if(!q){
    body = `<div class="empty">장소 이름, 음식 이름, 지역으로 찾아보세요.<br>예: 쌀국수, 해변, 시장, 다낭</div>`;
  } else {
    const hit = s => (s||"").toLowerCase().includes(q);
    const places = state.places.filter(p=>hit(p["이름"])||hit(p["베트남어이름"])||hit(p["안내"])||hit(p["지역"])||hit(p["분류"])||hit(originOf(p)));
    const groups = {};
    places.forEach(p=>{ (groups[p["분류"]] ||= []).push(p); });
    const routes = state.routes.filter(r=>hit(r["출발"])||hit(r["도착"])||hit(r["수단"])||hit(r["메모"]));
    const tips = state.tips.filter(t=>hit(t["내용"])||hit(t["분류"]));
    const parts = Object.keys(groups).sort((a,b)=>CATS.indexOf(a)-CATS.indexOf(b)).map(g=>
      `<div class="grouph"><b>${CAT_ICON[g]||"📍"} ${esc(g)}</b><span class="muted">${groups[g].length}곳</span></div>${cardsHTML(groups[g])}`);

    if(tips.length) parts.push(`<div class="grouph"><b>💡 팁</b><span class="muted">${tips.length}개</span></div><div class="list">${tips.map(t=>`<div>${esc(t["내용"])}</div>`).join("")}</div>`);
    body = parts.length ? parts.join("") : `<div class="empty">"${esc(state.q)}"에 맞는 정보가 아직 없어요.</div>`;
  }
  const page = document.getElementById("p-search");
  if(!page.querySelector("input.search")){
    page.innerHTML = `<h2>검색</h2><input class="search" type="search" placeholder="예: 쌀국수, 해변, 다낭" aria-label="검색"><div id="searchBody"></div>`;
    page.querySelector("input.search").addEventListener("input", e=>{ state.q=e.target.value; renderSearch(); });
  }
  document.getElementById("searchBody").innerHTML = body;
}

/* ---------- 클릭 처리 ---------- */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-tab],[data-city],[data-cat],[data-origin],[data-heart],[data-open],[data-copyaddr],[data-copyname],[data-seg],[data-kytype],[data-copyno],[data-copykakao],[data-krw],[data-newplace],[data-del],[data-adminlogin],[data-quick],[data-goqr],[data-gosearch],[data-goarea],[data-edit],#closeSheet,#sheetBg");
  if(!el) return;
  if(el.id==="closeSheet"||el.id==="sheetBg") return closeDetail();
  const d = el.dataset;
  if(d.seg){ state.transitSeg=d.seg; renderTransit(); return; }
  if(d.kytype){
    ky.type=d.kytype;
    document.querySelectorAll("[data-kytype]").forEach(b=>b.classList.toggle("on", b.dataset.kytype===d.kytype));
    const inp=document.getElementById("kyInput"); if(inp) inp.placeholder = d.kytype==="singer" ? "예: 아이유, 임영웅" : "예: 밤양갱, 사랑은 늘 도망가";
    return;
  }
  if(d.quick){
    if(d.quick==="new"){ openNewPlace(); return; }
    if(d.quick==="qr"){ state.tab="flight"; render(); setTimeout(()=>{ const t=document.getElementById("entryqr"); if(t) t.scrollIntoView({behavior:"smooth"}); },60); return; }
    if(d.quick==="ktv"){ state.tab="places"; state.cat="KTV"; state.origin="전체"; window.scrollTo(0,0); render(); return; }
    if(d.quick==="atm"){ state.tab="money"; render(); setTimeout(()=>{ const a=document.getElementById("atmList"); if(a) a.scrollIntoView({behavior:"smooth"}); },50); return; }
    state.tab=d.quick; window.scrollTo(0,0); render(); return;
  }
  if(d.goqr){ e.preventDefault(); const t=document.getElementById("entryqr"); if(t) t.scrollIntoView({behavior:"smooth"}); return; }
  if(d.gosearch){ state.tab="search"; render(); setTimeout(()=>{ const i=document.querySelector("#p-search input.search"); if(i) i.focus(); },50); return; }
  if(d.goarea){ state.city=d.goarea; state.cat="전체"; state.tab="places"; window.scrollTo(0,0); render(); return; }
  if(d.edit!==undefined){ const p=state.places[+d.edit]; if(p) openNewPlace(p); return; }
  if(d.newplace){ openNewPlace(); return; }
  if(d.del){ e.stopPropagation(); deletePlace(d.del); return; }
  if(d.adminlogin){ openAdminLogin(); return; }
  if(d.krw){ fx.amount={cur:"krw", v:+d.krw}; paintFx(); return; }
  if(d.copykakao!==undefined){ const p=state.places[+d.copykakao]; copyText(p["카톡"], "카카오톡 ID를 복사했어요. 카톡에서 친구 추가로 찾아보세요"); return; }
  if(d.copyno){ copyText(d.copyno, `KY ${d.copyno}번을 복사했어요`); return; }
  if(d.tab){ state.tab=d.tab; window.scrollTo(0,0); render(); return; }
  if(d.city){ state.city=d.city; render(); return; }
  if(d.origin){ state.origin=d.origin; render(); return; }
  if(d.cat){ state.cat=d.cat; render(); return; }
  if(d.heart!==undefined){ e.stopPropagation(); toggleSave(state.places[+d.heart]); return; }

function dbHeaders(auth){
  const h = { "apikey": CONFIG.SUPABASE_ANON_KEY, "Content-Type": "application/json" };

async function adminToken(){

  if(Date.now() < admin.exp - 60000) return admin.token;
  try{

    const d = await r.json(); if(!r.ok) throw 0;

async function submitNewPlace(e){
  e.preventDefault();

  const v = k => String(f.get(k)||"").trim();

      const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/place_overrides?on_conflict=key`, {method:"POST",
        headers:{...dbHeaders(tok), "Prefer":"resolution=merge-duplicates,return=representation"},
        body:JSON.stringify({key:editKey, data, updated_at:new Date().toISOString()})});
      const out = r.ok ? await r.json() : [];
      if(!out.length) throw new Error("수정 권한 없음");
      closeDetail(); toast("고친 내용을 저장했어요"); refreshPlaces(); return;
    }
    if(editId){
      if(!tok) throw new Error("관리자만 고칠 수 있어요");
      delete row.is_admin;
      const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/user_places?id=eq.${encodeURIComponent(editId)}`, {method:"PATCH", headers:{...dbHeaders(tok), "Prefer":"return=representation"}, body:JSON.stringify(row)});
      const out = r.ok ? await r.json() : [];
      if(!out.length) throw new Error("수정 권한 없음");
      closeDetail(); toast("고친 내용을 저장했어요"); refreshPlaces(); return;
    }
    const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/user_places`, {method:"POST", headers:{...dbHeaders(tok), "Prefer":"return=minimal"}, body:JSON.stringify(row)});
    if(!r.ok) throw new Error(await r.text());
    lastPost = Date.now(); closeDetail(); toast("고마워요! 장소가 올라갔어요"); refreshPlaces();
  }catch(err){
    console.warn(err); btn.disabled = false; btn.textContent = (editId||editKey)?"고친 내용 저장":"올리기"; toast((editId||editKey)?"저장하지 못했어요. 관리자 로그인을 확인해 주세요":"올리지 못했어요. 잠시 뒤 다시 해 주세요");
  }

function setupPhotoEditor(form){
  const hidden = form.querySelector("input[name=photos]");
  const list = form.querySelector("#photoList");
  const get = () => hidden.value.split("|").map(x=>x.trim()).filter(Boolean);
  const set = arr => { hidden.value = arr.join("|"); paint(); };
  function paint(){
    const arr = get();
    list.innerHTML = arr.length ? arr.map((u,n)=>`<div class="ph"><img src="${esc(u)}" alt=""><button type="button" data-rm="${n}" aria-label="사진 빼기">✕</button>${n===0?'<span>대표</span>':`<button type="button" class="first" data-first="${n}">대표로</button>`}</div>`).join("")
      : `<div class="muted" style="font-size:13px">아직 넣은 사진이 없어요.</div>`;
  }
  list.addEventListener("click", e=>{

    if(rm!==undefined){ arr.splice(+rm,1); set(arr); }

  });

  });

    const files = [...e.target.files]; e.target.value = "";
    for(const file of files){
      toast("사진 올리는 중…");

      catch(err){ console.warn(err); toast("사진을 올리지 못했어요"); }
    }
  });
  paint();
}
async function shrinkImage(file, max=1400){
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
  const k = Math.min(1, max/Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(img.src);
  return await new Promise(res=>c.toBlob(res,"image/jpeg",0.82));
}
async function uploadPhoto(file){
  const tok = await adminToken(); if(!tok) throw new Error("로그인 필요");
  const blob = await shrinkImage(file);
  const path = `places/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
  const r = await fetch(`${CONFIG.SUPABASE_URL}/storage/v1/object/place-photos/${path}`, {method:"POST",
    headers:{"apikey":CONFIG.SUPABASE_ANON_KEY, "Authorization":"Bearer "+tok, "Content-Type":"image/jpeg", "x-upsert":"false"}, body:blob});
  if(!r.ok) throw new Error(await r.text());
  return `${CONFIG.SUPABASE_URL}/storage/v1/object/public/place-photos/${path}`;
}

(async function start(){
  render();
  const [pl, ro, ti] = await Promise.all([
    loadCSV(CONFIG.PLACES_CSV, SAMPLE_PLACES),
    loadCSV(CONFIG.ROUTES_CSV, SAMPLE_ROUTES),
    loadCSV(CONFIG.TIPS_CSV, SAMPLE_TIPS)
  ]);
  sheetPlaces = pl.rows.filter(visible).map(p=>({...p, _key:"s:"+p["이름"]+"|"+p["지역"]}));
  const [ov, community] = await Promise.all([loadOverrides(), loadCommunity()]);
  overrides = ov;
  state.places = applyOverrides(sheetPlaces).concat(community);
  state.routes = ro.rows.filter(visible);
  state.tips = ti.rows.filter(visible);
  state.usingSample = pl.sample;
  loadWikiImages(state.places.concat([{위키:HERO_WIKI, 사진:""}])).then(changed=>{ if(changed) render(); });
  render();
})();

if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>

function fillGuides(root){ (root||document).querySelectorAll("img[data-guide]").forEach(im=>{ if(!im.getAttribute("src")) im.src = GUIDE_IMG[im.dataset.guide]; }); }
document.addEventListener("toggle", e=>{ if(e.target.matches && e.target.matches("details.guideimg") && e.target.open) fillGuides(e.target); }, true);
document.addEventListener("click", e=>{
  const im = e.target.closest && e.target.closest("img[data-guide]");
  if(im){ document.getElementById("zoomimg").src = im.src || GUIDE_IMG[im.dataset.guide]; document.getElementById("zoomview").classList.add("on"); document.body.style.overflow="hidden"; return; }
  if(e.target.id==="zoomclose" || e.target.id==="zoomview"){ document.getElementById("zoomview").classList.remove("on"); document.body.style.overflow=""; }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ document.getElementById("zoomview").classList.remove("on"); document.body.style.overflow=""; } });
</script>
