name: 안드로이드 APK 만들기

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK 만들기
        run: gradle -p android assembleRelease --no-daemon

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk hcm-guide.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hcm-guide-apk
          path: hcm-guide.apk

      - name: 다운로드 페이지(Release)에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: 호치민 탐방 가이드 안드로이드 앱 v1.0.${{ github.run_number }}
          body: |
            아래 **hcm-guide.apk**를 휴대폰에서 눌러 설치하세요.
            처음 설치할 때 "출처를 알 수 없는 앱 설치 허용"을 물으면 허용해 주세요.
          files: hcm-guide.apk
          make_latest: true
